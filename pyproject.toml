[project]
name = "silentgroup"
version = "0.1.0"
description = "QFF hackathon: Diffie-Hellman in a hidden abelian group"
requires-python = ">=3.10"
dependencies = ["qiskit>=1.2", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["silentgroup"]

[tool.setuptools.package-data]
silentgroup = ["instances/*.json"]
